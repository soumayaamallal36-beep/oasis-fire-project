# ================================================================
# CONFIGURATION CENTRALE — Wildfire Prediction Agdez
# ================================================================

zone:
  nom: "Agdez"
  pays: "Maroc"
  latitude: 30.69
  longitude: -6.45
  pente_moy_deg: 5.73
  altitude_m: 1169.3
  exposition_deg: 165.51     # Sud-Est

modele:
  random_seed: 42
  cv_folds: 5
  test_size: 0.2
  meilleur_algo: "auto"      # auto = sélectionner par CV

  hyperparams:
    random_forest:
      n_estimators: 200
      max_depth: 6
      class_weight: "balanced"
    gradient_boosting:
      n_estimators: 150
      max_depth: 4
      learning_rate: 0.1
    logistic_regression:
      max_iter: 1000
      C: 1.0

features:
  climatiques:
    - temperature
    - humidite
    - precipitation
    - vent
  topographiques:
    - pente
    - altitude
    - exposition
  satellitaires:
    - ndvi_avant
  derivees:
    - indice_secheresse
    - indice_propagation
    - stress_vegetal
    - exposition_sud
    - mois_num

risque:
  classes: ["Faible", "Moyen", "Élevé", "Très élevé"]
  seuils_alerte:
    orange: "Élevé"
    rouge: "Très élevé"

alertes:
  email_destinataires:
    - "responsable@protection-civile.ma"
  webhook_url: ""            # URL pour notifications temps-réel

chemins:
  modele:   "models/trained/model_risque_incendie.pkl"
  encodeur: "models/trained/label_encoder.pkl"
  metadata: "models/metadata/model_info.json"
  rapport:  "reports/"
